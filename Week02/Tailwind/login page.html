<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
        <div class="bg-purple-500 w-full max-w-md rounded-2xl shadow-xl shadow-slate-100 border border-slate-100 p-8">
            <div class="bg-white w-20 h-20 rounded-full mx-auto flex items-center justify-center border shadow-xl">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="40" height="40">

            </div>
            <div>
                <form class="margin-top: 20px">
                    <div class="relative">
                        <label for="name" class="block text-sm font-semibold text-black mb-1.5">User Name</label>
                        <input class="bg-white w-full px-4 py-3 rounded-lg border border-slate-200 text-white placeholder-slate-400 text-sm "
                        type="text" id="name" placeholder="Enter User Name" />
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="absolute h-8 w-8 top-[30px] right-0">
                            <path d="M240 192C240 147.8 275.8 112 320 112C364.2 112 400 147.8 400 192C400 236.2 364.2 272 320 272C275.8 272 240 236.2 240 192zM448 192C448 121.3 390.7 64 320 64C249.3 64 192 121.3 192 192C192 262.7 249.3 320 320 320C390.7 320 448 262.7 448 192zM144 544C144 473.3 201.3 416 272 416L368 416C438.7 416 496 473.3 496 544L496 552C496 565.3 506.7 576 520 576C533.3 576 544 565.3 544 552L544 544C544 446.8 465.2 368 368 368L272 368C174.8 368 96 446.8 96 544L96 552C96 565.3 106.7 576 120 576C133.3 576 144 565.3 144 552L144 544z"/></svg>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-semibold text-black mb-1.5">Email</label>
                        <div class="relative">
                        <input class="bg-white w-full px-4 py-3 rounded-lg border border-slate-200 text-white placeholder-slate-400 text-sm"
                        type="text" id="email" placeholder="Enter Email" />
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" class="absolute h-8 w-8 top-[7px] right-0">
                            <path d="M125.4 128C91.5 128 64 155.5 64 189.4C64 190.3 64 191.1 64.1 192L64 192L64 448C64 483.3 92.7 512 128 512L512 512C547.3 512 576 483.3 576 448L576 192L575.9 192C575.9 191.1 576 190.3 576 189.4C576 155.5 548.5 128 514.6 128L125.4 128zM528 256.3L528 448C528 456.8 520.8 464 512 464L128 464C119.2 464 112 456.8 112 448L112 256.3L266.8 373.7C298.2 397.6 341.7 397.6 373.2 373.7L528 256.3zM112 189.4C112 182 118 176 125.4 176L514.6 176C522 176 528 182 528 189.4C528 193.6 526 197.6 522.7 200.1L344.2 335.5C329.9 346.3 310.1 346.3 295.8 335.5L117.3 200.1C114 197.6 112 193.6 112 189.4z"/>
                        </svg>
                    </div>
                    </div>
                    <div>
                        <label for="Password" class="block text-sm font-semibold text-black mb-1.5">Password</label>
                        <input class="bg-white w-full px-4 py-3 rounded-lg border border-slate-200 text-black placeholder-slate-400 text-sm"
                        type="password" id="Password" placeholder="Password" />
                        </div>
                    <br> 
                    <div class="flex justify-center">
                    <button type="submit" 
                            class="justify-center items-center p-4 bg-white hover:bg-purple-200 text-black font-medium rounded-2xl text-sm transition-all duration-150 cursor-pointer shadow-lg shadow-blue-500/20 active:scale-[0.98]">
                        Submit
                    </button>
                    </div>
                </form>
            </div>
      </div>
    </body>
</html>
